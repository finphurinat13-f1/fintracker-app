<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;1,6..96,400&display=swap" rel="stylesheet">
<style>
  * { font-family: 'Chakra Petch', sans-serif; font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
  .text-2xl, .text-3xl, .text-4xl, .text-5xl { letter-spacing: -0.025em; }

  /* ── Liquid Glass Background ── */
  .bg-app {
    background: #060c18;
  }

  /* ── Liquid Glass Surface ── */
  .glass {
    background: linear-gradient(160deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.05) 40%, rgba(255,255,255,0.02) 100%);
    backdrop-filter: blur(48px) saturate(1.8) brightness(1.06);
    -webkit-backdrop-filter: blur(48px) saturate(1.8) brightness(1.06);
    border: 1px solid rgba(255,255,255,0.18);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.28), inset 0 -1px 0 rgba(0,0,0,0.08), 0 8px 40px rgba(0,0,0,0.38), 0 2px 8px rgba(0,0,0,0.2);
    transition: all 0.3s cubic-bezier(0.22,1,0.36,1);
  }
  .glass:hover {
    background: linear-gradient(160deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.07) 40%, rgba(255,255,255,0.03) 100%);
    border-color: rgba(255,255,255,0.28);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 12px 56px rgba(0,0,0,0.45), 0 2px 8px rgba(0,0,0,0.25);
    transform: translateY(-1px);
  }
  /* ── Card surfaces ──────────────────────────────────────────────────────
     Flat, on hairlines. These used to carry a 48px backdrop blur, an indigo
     glow and a lift on hover — the stacked-glass look every finance app shipped
     around 2020. It reads as decoration now, and on a page whose job is columns
     of figures it competes with them: a soft shadow under every card gives the
     eye an edge to catch on between each number and the next.
     What replaces it is a 1px line and nothing else, which is what the current
     generation of finance tools (Linear, Mercury, Ramp) settled on. */
  .glass-light {
    background: #ffffff;
    border: 1px solid rgba(15,23,42,0.08);
    box-shadow: none;
  }

  /* The card colour follows the theme. It used to be one fixed blue-black,
     which was invisible while every theme was blue-ish and obvious the moment
     one was not — a green page with blue cards on it. Inherited through a
     custom property set alongside the page background, so the two are decided
     in the same place and cannot drift apart. */
  /* Each card carries its own light. The page has a warm glow behind it, but
     an opaque card paints straight over it, so the gold only ever reached the
     gaps between cards — the left margin — while every surface holding actual
     content stayed flat. Waiting on the page glow also meant cards further
     down the page could never receive any of it. A gradient on the card itself
     is independent of where the card sits, so the fifth one down is lit like
     the first. Kept under 6% so it reads as a surface catching light rather
     than as a coloured panel.

     The hairline went warm at the same time: a white border on a gold theme is
     the same mistake the blue ground was. */
  .card-solid {
    background:
      linear-gradient(152deg, rgba(212,160,23,0.055) 0%, rgba(212,160,23,0.020) 36%, rgba(212,160,23,0.000) 64%),
      var(--card-bg, #0b1220);
    border: 1px solid rgba(212,160,23,0.11);
    box-shadow: none;
    transition: border-color 0.15s ease;
  }
  /* Hover marks the border, not the elevation — nothing moves, so a table of
     figures does not shift under the cursor. */
  .card-solid:hover   { border-color: rgba(201,169,75,0.28); }
  .glass-light:hover  { border-color: rgba(201,169,75,0.35); }

  /* Tighter corners throughout. rounded-2xl (16px) on every card is what makes
     a dense screen read as a pile of pills; 10-12px keeps the shape without
     rounding the data away. Overridden here rather than at ~200 call sites. */
  .rounded-2xl { border-radius: 0.75rem !important; }
  .rounded-xl  { border-radius: 0.625rem !important; }

  /* ── Type scale ──────────────────────────────────────────────────────────
     The sizes in use were 9, 10, 11, 12, 14, 16, 18, 20, 24, 30 — four of them
     inside a four-pixel band carrying 526 of the ~850 pieces of text on screen.
     One pixel is not a hierarchy; it is a coin flip about which line matters,
     made 526 times.
     So the crowded bottom collapses into two real steps, and the top opens up:
     the distance between a heading and the line under it now does the work that
     bold alone was being asked to do. Ratios rather than pixels, so the steps
     stay distinguishable at any zoom. Set here because these classes appear at
     hundreds of call sites and the scale is one decision, not hundreds. */
  .text-\[9px\]  { font-size: 10.5px !important; }
  .text-\[10px\] { font-size: 10.5px !important; }
  .text-\[11px\] { font-size: 11.5px !important; }
  .text-xs       { font-size: 12.5px !important; line-height: 1.55 !important; }
  .text-sm       { font-size: 14px   !important; line-height: 1.6  !important; }
  .text-base     { font-size: 16px   !important; }
  .text-lg       { font-size: 19px   !important; line-height: 1.35 !important; }
  .text-xl       { font-size: 23px   !important; line-height: 1.3  !important; }
  .text-2xl      { font-size: 28px   !important; line-height: 1.25 !important; }
  .text-3xl      { font-size: 36px   !important; line-height: 1.15 !important; }

  /* Labels read as labels rather than as small body text. The tracking is what
     separates them once they are no longer a pixel apart from the line below. */
  .uppercase { letter-spacing: 0.06em; }

  /* ── Amber monochrome (dark) ─────────────────────────────────────────────
     One hue, four brightnesses — the way an amber CRT actually worked. The
     screen was never a single gold: hierarchy came from how hot the phosphor
     was driven, and that is what is copied here. Text was slate-blue at 565
     call sites, which is a second palette running underneath the gold one and
     the reason nothing looked like it belonged together.

     Gains and losses keep green and red on purpose. Those are not decoration:
     they are the only thing on the screen that says which direction the money
     went, and a monochrome that eats them has traded reading for looking.

     Dark only. On the light theme this reads as faded ink, not phosphor.
     Delete this block to undo the whole idea. */
  .dark .text-white          { color: #f5e6c8 !important; }
  .dark .text-slate-200      { color: #e6d3a8 !important; }
  .dark .text-slate-300      { color: #d4bd8a !important; }
  .dark .text-slate-400      { color: #a8905c !important; }
  .dark .text-slate-500      { color: #857249 !important; }
  .dark .text-slate-600      { color: #6b5c3b !important; }

  /* ── Liquid Glass Cards (reserved for hero + modals only) ── */
  .card-hero {
    position: relative; overflow: hidden;
    background: linear-gradient(135deg, rgba(168,134,47,0.06) 0%, rgba(201,169,74,0.03) 50%, rgba(0,0,0,0.02) 100%);
    border: 1px solid rgba(180,150,80,0.2);
    box-shadow: inset 0 1px 0 rgba(255,244,210,0.1), 0 0 60px rgba(168,134,47,0.1), 0 8px 48px rgba(0,0,0,0.65);
  }
  /* Glows follow the muted gain/loss pair from the Tailwind config. A halo is
     the one place a saturated colour does the most damage, since it bleeds
     past the card edge onto the page itself. */
  .card-income-g { border-color: rgba(122,171,138,0.35) !important; box-shadow: inset 0 1px 0 rgba(122,171,138,0.3), 0 0 45px rgba(95,144,112,0.12), 0 8px 32px rgba(0,0,0,0.38) !important; }
  .card-expense-g { border-color: rgba(201,114,106,0.35) !important; box-shadow: inset 0 1px 0 rgba(201,114,106,0.3), 0 0 45px rgba(173,90,83,0.12), 0 8px 32px rgba(0,0,0,0.38) !important; }

  /* ── Text Colors ── */
  .tg-brand   { color: #c9a94b; text-shadow: 0 0 18px rgba(201,169,74,0.3); }
  .glow-num   { color: #c9a94b; }
  .tg-white   { color: #dde8f2; }
  .tg-green   { color: #0ca34b; }
  .tg-red     { color: #e53e3e; }
  .tg-indigo  { color: #c9a94b; }
  .tg-gold    { color: #c8a84a; }
  .tg-emerald { color: #27ae60; }

  /* ── Institutional Button ── */
  .btn-primary {
    background: linear-gradient(135deg, rgba(201,169,74,0.97) 0%, rgba(168,134,47,0.97) 100%);
    border: 1px solid rgba(220,190,110,0.5);
    box-shadow: inset 0 1px 0 rgba(255,244,210,0.35), 0 4px 18px rgba(168,134,47,0.35);
    transition: all 0.2s cubic-bezier(0.22,1,0.36,1);
    color: #10173a;
  }
  .btn-primary:hover { background: linear-gradient(135deg, rgba(214,184,92,0.99) 0%, rgba(184,148,55,0.99) 100%); box-shadow: inset 0 1px 0 rgba(255,244,210,0.45), 0 6px 24px rgba(168,134,47,0.5); transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }
  /* Solid gold fills read as classic navy-on-gold (complementary hue, near-black
     contrast): [class~=] matches only the solid utility token, never /opacity tints. */
  [class~="bg-gold-500"], [class~="bg-gold-600"], [class~="bg-gold-700"] { color: #10173a; }
  [class~="bg-gold-500"] svg, [class~="bg-gold-600"] svg, [class~="bg-gold-700"] svg { color: #10173a; }

  /* ── Badge ── */
  .badge-pos { background: rgba(52,211,153,0.1) !important; border: 1px solid rgba(52,211,153,0.3) !important; }
  .badge-neg { background: rgba(251,113,133,0.1) !important; border: 1px solid rgba(251,113,133,0.3) !important; }

  /* ── Nav & Logo ── */
  .nav-active-dk { background: rgba(201,169,74,0.16); border: 1px solid rgba(220,190,110,0.35); box-shadow: inset 0 1px 0 rgba(255,244,210,0.1); }
  .nav-active-lt { background: rgba(168,134,47,0.1); border: 1px solid rgba(168,134,47,0.35); box-shadow: 0 2px 8px rgba(168,134,47,0.12); }
  .logo-icon { background: linear-gradient(135deg,rgba(201,169,74,0.25) 0%,rgba(168,134,47,0.4) 100%); border: 1px solid rgba(220,190,110,0.4); box-shadow: inset 0 1px 0 rgba(255,244,210,0.25), 0 4px 14px rgba(168,134,47,0.25); }

  /* ── Nav bar background override ── */
  .dark nav { background: rgba(40,40,40,0.95) !important; border-bottom-color: rgba(255,255,255,0.10) !important; }

  .row-mod { border-left: 3px solid transparent; transition: all 0.15s ease; }
  .row-mod:hover { border-left-color: rgba(255,255,255,0.3) !important; background: rgba(255,255,255,0.04) !important; }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-thumb { background: linear-gradient(180deg,rgba(255,255,255,0.2),rgba(255,255,255,0.08)); border-radius:99px; }
  ::-webkit-scrollbar-track { background: transparent; }

  @keyframes fadeUp    { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
  @keyframes scaleIn   { from{opacity:0;transform:scale(0.94)}      to{opacity:1;transform:scale(1)} }
  .fade-up  { animation: fadeUp  0.38s cubic-bezier(.22,1,.36,1) forwards; }
  @keyframes hintPulse { 0%,100%{box-shadow:0 0 0 3px rgba(201,169,74,0.3),0 0 14px rgba(201,169,74,0.55)} 50%{box-shadow:0 0 0 3px rgba(201,169,74,0.5),0 0 24px rgba(201,169,74,0.85)} }
  @keyframes ctaPulse { 0%,100%{box-shadow:0 4px 14px rgba(224,165,58,0.4)} 50%{box-shadow:0 6px 26px rgba(224,165,58,0.7),0 0 0 5px rgba(224,165,58,0.16)} }
  @keyframes greenRing { 0%,100%{box-shadow:0 0 0 3px rgba(122,171,138,.9),0 0 0 6px rgba(122,171,138,0)} 50%{box-shadow:0 0 0 3px rgba(122,171,138,.7),0 0 0 10px rgba(122,171,138,.18)} }
  @keyframes checkPop { 0%{transform:scale(0)} 55%{transform:scale(1.12)} 100%{transform:scale(1)} }
  @keyframes checkDraw { from{stroke-dashoffset:26} to{stroke-dashoffset:0} }
  @keyframes toastDrop { from{opacity:0;transform:translateY(-14px)} to{opacity:1;transform:translateY(0)} }
  .toast-drop { animation: toastDrop .28s cubic-bezier(.22,1,.36,1) both; }
  .scale-in { animation: scaleIn 0.24s cubic-bezier(.22,1,.36,1) forwards; }
  @keyframes undoShrink { from{width:100%} to{width:0%} }
  .undo-bar { animation: undoShrink 5s linear forwards; }
  /* Action sheet: rises from the thumb on a phone, settles in place on a desktop */
  @keyframes sheetUp { from{opacity:0;transform:translateY(28px)} to{opacity:1;transform:translateY(0)} }
  .sheet-up { animation: sheetUp .26s cubic-bezier(.32,.72,0,1) both; }
  @media (min-width:640px) { .sheet-up { animation: scaleIn .2s cubic-bezier(.22,1,.36,1) both; } }
  @media (prefers-reduced-motion: reduce) { .sheet-up { animation: none; } }
  /* Hairline dividers between stacked actions — 1px at any pixel density */
  .sheet-row + .sheet-row { border-top: 1px solid var(--sheet-line); }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  .modal-bg { background: rgba(10,10,10,0.75); backdrop-filter: blur(24px); }
  .dark select { background-color: #0d1625 !important; color: #dde8f2 !important; }
  .dark select option { background-color: #0d1625 !important; color: #dde8f2 !important; }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
  .dark input:focus, .dark select:focus { box-shadow: 0 0 0 3px rgba(96,165,250,0.22); outline: none; }

  /* ── Keyboard focus ring — visible for keyboard nav, invisible on mouse click ── */
  button:focus-visible, a:focus-visible, [role="button"]:focus-visible, summary:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid #3f6fb0; outline-offset: 2px;
  }
  .dark button:focus-visible, .dark a:focus-visible, .dark [role="button"]:focus-visible, .dark summary:focus-visible, .dark [tabindex]:focus-visible {
    outline-color: #8fb4e0;
  }
  :focus:not(:focus-visible) { outline: none; }
  .dark select { background-color: #0d1625 !important; color: #dde8f2 !important; }
  .dark select option { background-color: #0d1625 !important; color: #dde8f2 !important; }
  @media print { nav,.no-print{display:none!important} .bg-app{background:white!important} body{background:white} .glass{background:rgba(248,250,252,0.95)!important;border-color:#e2e8f0!important;box-shadow:none!important;backdrop-filter:none!important;animation:none!important} .tg-brand,.tg-white,.tg-green,.tg-red,.tg-gold,.tg-emerald,.tg-indigo{color:#1e293b!important} }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
